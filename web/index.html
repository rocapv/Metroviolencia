<!doctype html>
<html lang="ca-ES-valencia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Metro · trens en directe · Metrovalència</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=202610301845">
</head>
<body>
  <div id="map"></div>

  <header id="hud" class="collapsed">
    <button id="hud-toggle" title="Amaga/mostra el panell" aria-label="Mostra el panell">»</button>
    <div id="hud-body">
      <div class="titulo">
        <span class="dot-live"></span> METRO
      </div>
      <div id="stats">carregant…</div>
      <div id="leyenda"></div>
      <div class="llegenda-retard">Vora de la fletxa: <b style="color:#f59e0b">+1,5 min</b> ·
        <b style="color:#ef4444">+3 min</b> · <b style="color:#38bdf8">avançat</b></div>
      <div id="avisos"></div>
      <a class="link-registre" href="registre.html">Registre d'eixides →</a>
    </div>
  </header>

  <!-- hora local · segons des de l'última lectura de FGV (al servidor) · segons des de l'últim refresc d'aquest client -->
  <div id="reloj">
    <span id="reloj-hora"></span><span class="reloj-sep">·</span><span id="reloj-fgv" title="segons des que el servidor va acabar l'última lectura de FGV">FGV —</span><span class="reloj-sep">·</span><span id="reloj-cli" title="segons des de l'últim refresc d'aquest client">client —</span>
  </div>

  <nav id="menu">
    <button id="btn-ruta" data-panel="panel-ruta">Ruta</button>
    <button id="btn-retards" data-panel="panel-retards">Retards</button>
    <button id="btn-xat" data-panel="panel-xat">Xat</button>
  </nav>

  <section id="panel-ruta" class="panel" hidden>
    <div class="panel-cap"><b>Calcula la ruta</b><button class="panel-tanca" aria-label="Tanca">×</button></div>
    <div class="ruta-form">
      <input id="ruta-orig" list="ruta-est" placeholder="Origen" autocomplete="off">
      <button id="ruta-swap" title="Inverteix" aria-label="Inverteix origen i destí">⇅</button>
      <input id="ruta-dest" list="ruta-est" placeholder="Destí" autocomplete="off">
      <datalist id="ruta-est"></datalist>
    </div>
    <div class="ruta-acc">
      <button id="ruta-calc" class="primari">Calcula</button>
      <button id="ruta-esborra">Esborra</button>
    </div>
    <label class="ruta-nomes"><input type="checkbox" id="ruta-nomes" checked> Mostra només els trens que he d'agafar</label>
    <div id="ruta-res"></div>
  </section>

  <section id="panel-retards" class="panel" hidden>
    <div class="panel-cap"><b>Retards i cancel·lacions</b><button class="panel-tanca" aria-label="Tanca">×</button></div>
    <div id="ret-tipus" class="ret-tipus"></div>
    <div id="ret-kpis" class="ret-kpis"></div>
    <div class="ret-tabs">
      <button data-f="tard" class="on">Van tard</button>
      <button data-f="cancelada">Cancel·lats</button>
      <button data-f="tots">Tots</button>
      <button data-f="ruta">En ruta</button>
    </div>
    <div id="ret-llista"></div>
    <a class="ret-link" href="registre.html">Registre complet del dia →</a>
  </section>

  <!-- xat: des del tren en què vas (triat per proximitat, calculada al mòbil) o des d'una estació -->
  <section id="panel-xat" class="panel" hidden>
    <div class="panel-cap"><b>Xat de la xarxa</b><button class="panel-tanca" aria-label="Tanca">×</button></div>
    <div id="xat-lloc" class="xat-lloc"></div>
    <div class="xat-acc">
      <button id="xat-ubicacio" class="primari" title="Usa la ubicació del mòbil per a trobar el tren en què vas. La posició no s'envia a cap servidor.">Vaig en un tren (ubicació)</button>
      <input id="xat-est" list="ruta-est" placeholder="…o des d'una estació" autocomplete="off">
    </div>
    <div id="xat-candidats"></div>
    <div class="xat-form">
      <input id="xat-alias" maxlength="24" placeholder="àlies (opcional)" autocomplete="off">
      <textarea id="xat-text" maxlength="200" rows="2" placeholder="Escriu un missatge (el veu tota la xarxa)"></textarea>
      <button id="xat-envia" class="primari">Envia</button>
    </div>
    <div id="xat-avis" class="xat-avis"></div>
    <div class="pop-arr-tit">Últims missatges de la xarxa</div>
    <div id="xat-feed"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="app.js?v=202610301845"></script>
  <script src="panells.js?v=202610301845"></script>
  <script src="xat.js?v=202610301845"></script>
  <script src="desti.js?v=202610301845"></script>
</body>
</html>
