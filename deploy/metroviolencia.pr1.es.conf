<VirtualHost *:80>
    # metroviolencia.pr1.es · nombre ANTIGUO (05/10/2026 – 30/10/2026): todo va a metro.pr1.es.
    # Instalar en: /etc/apache2/sites-available/metroviolencia.pr1.es.conf
    #   sudo a2ensite metroviolencia.pr1.es && sudo systemctl reload apache2
    # El nombre lo mantiene el DDNS de Raspa (~/ddns_ovh/ddns_ovh.py, lista REGISTROS).
    ServerName metroviolencia.pr1.es

    # Reto ACME (Let's Encrypt) servido desde webroot, NO redirigir.
    Alias /.well-known/acme-challenge /var/www/metroviolencia.pr1.es/.well-known/acme-challenge
    <Directory /var/www/metroviolencia.pr1.es/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Todo lo demás, al nombre nuevo y por HTTPS (el reto ACME se queda: renueva el cert viejo).
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://metro.pr1.es/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/metroviolencia.pr1.es-error.log
    CustomLog ${APACHE_LOG_DIR}/metroviolencia.pr1.es-access.log combined
</VirtualHost>
