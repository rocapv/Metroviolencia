<VirtualHost *:443>
    # metroviolencia.pr1.es · Metroviolencia en la RAÍZ de su propio nombre (05/10/2026).
    # Instalar en: /etc/apache2/sites-available/metroviolencia.pr1.es-ssl.conf
    #   (después de sacar el certificado: ver README.md, "Subdominio propio")
    #   sudo a2ensite metroviolencia.pr1.es-ssl && sudo systemctl reload apache2
    #
    # El acceso (token o no) lo decide la aplicación, no Apache: mira la IP real que Apache
    # añade a X-Forwarded-For y data/open_until.txt. Ver README.md, "Acceso".
    ServerName metroviolencia.pr1.es

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/metroviolencia.pr1.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/metroviolencia.pr1.es/privkey.pem

    ProxyPreserveHost On

    # Aquí la aplicación cuelga de "/", no de "/metroviolencia": la cookie del token tiene que
    # valer para toda la raíz (la aplicación solo la pone en "/" si ve esta cabecera).
    RequestHeader set X-Forwarded-Prefix "/"
    RequestHeader set X-Forwarded-Proto  "https"

    # /api/ ya tiene dueño: director-ocr.conf declara un <Location /api/> FUERA de todo vhost y
    # se llevaría el /api de TODOS los sitios a la API OCR del Director. Se le gana con otro
    # <Location /api/> dentro del vhost (un ProxyPass suelto no basta).
    <Location /api/>
        ProxyPass        http://127.0.0.1:8770/api/
        ProxyPassReverse http://127.0.0.1:8770/api/
    </Location>
    ProxyPass        / http://127.0.0.1:8770/
    ProxyPassReverse / http://127.0.0.1:8770/

    # Un año de HSTS, como home.pr1.es (solo este nombre, sin includeSubDomains).
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/metroviolencia.pr1.es-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/metroviolencia.pr1.es-ssl-access.log combined
</VirtualHost>
