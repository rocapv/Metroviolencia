<VirtualHost *:443>
    # metroviolencia.pr1.es · nombre ANTIGUO (05/10/2026 – 30/10/2026). Desde el 30/10/2026 la
    # web vive en https://metro.pr1.es/ (metro.pr1.es-ssl.conf); aquí solo se redirige, con la
    # ruta y la query, para no romper enlaces ni marcadores.
    # Instalar en: /etc/apache2/sites-available/metroviolencia.pr1.es-ssl.conf
    #   sudo a2ensite metroviolencia.pr1.es-ssl && sudo systemctl reload apache2
    ServerName metroviolencia.pr1.es

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/metroviolencia.pr1.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/metroviolencia.pr1.es/privkey.pem

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://metro.pr1.es/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/metroviolencia.pr1.es-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/metroviolencia.pr1.es-ssl-access.log combined
</VirtualHost>
