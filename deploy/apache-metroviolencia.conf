# Metroviolencia — proxy invers a uvicorn (127.0.0.1:8770), NOMÉS xarxa local.
# Instal·lar a: /etc/apache2/conf-available/metroviolencia.conf
#   sudo a2enconf metroviolencia && sudo systemctl reload apache2
# Accés: http://<ip-lan>/metroviolencia/

# Acceso abierto en Apache; el gate lo hace la app: LAN sin token, fuera con
# token obligatorio (mira X-Forwarded-For que añade este proxy).
<Location /metroviolencia>
    Require all granted
</Location>

ProxyPreserveHost On
ProxyPass        /metroviolencia/ http://127.0.0.1:8770/
ProxyPassReverse /metroviolencia/ http://127.0.0.1:8770/

# afegeix la barra final si falta
RedirectMatch permanent ^/metroviolencia$ /metroviolencia/

# --- Puerto dedicado externo para Metroviolencia (HTTPS, cert home.pr1.es) ---
# Reenviar en el router: <puerto público> -> Raspa:8751
Listen 8751
<VirtualHost *:8751>
    ServerName home.pr1.es
    SSLEngine on
    SSLCertificateFile    /etc/ssl/home.pr1.es/home.pr1.es.crt
    SSLCertificateKeyFile /etc/ssl/home.pr1.es/home.pr1.es.key
    # la raíz del puerto lleva directo al mapa (el Location/ProxyPass es global)
    RedirectMatch permanent ^/?$ /metroviolencia/
</VirtualHost>
